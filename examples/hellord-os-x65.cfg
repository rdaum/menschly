MEMORY {
  ZP: start = $000080, size = $000080, type = rw;
  CODE: start = $00a000, size = $005fe4, file = "code.bin";
  BANK1: start = $01c000, size = $004000, file = "bank1.bin";
  META: start = $009f00, size = $000100, file = "meta.bin";
  BSS: start = $009000, size = $000f00, type = rw;
  VECTORS: start = $00ffe4, size = $00000c, file = "vectors.bin";
}
SEGMENTS {
  ZEROPAGE: load = ZP, type = zp;
  CODE: load = CODE, type = ro;
  BANK1: load = BANK1, type = ro;
  MENSCH_META: load = META, type = ro, optional = yes;
  BSS: load = BSS, type = bss;
  VECTOR_COP: load = VECTORS, type = ro, optional = yes, offset = $0000;
  VECTOR_BRK: load = VECTORS, type = ro, optional = yes, offset = $0002;
  VECTOR_ABORT: load = VECTORS, type = ro, optional = yes, offset = $0004;
  VECTOR_NMI: load = VECTORS, type = ro, optional = yes, offset = $0006;
  VECTOR_IRQ: load = VECTORS, type = ro, optional = yes, offset = $000a;
  VECTORS: load = VECTORS, type = ro, optional = yes;
}
