[package]
name = "menschly"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
path = "compiler/src/lib.rs"

[[bin]]
name = "menschc"
path = "compiler/src/bin/menschc.rs"

[[bin]]
name = "mensch-run-x65"
path = "compiler/src/bin/mensch-run-x65.rs"

[[bin]]
name = "mensch-run-mega65"
path = "compiler/src/bin/mensch-run-mega65.rs"

[[bin]]
name = "mensch-mega65-program"
path = "compiler/src/bin/mensch-mega65-program.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
x65alike-emul = { path = "x65alike-emul" }
wdc65816 = "0.1.0"

[dev-dependencies]
