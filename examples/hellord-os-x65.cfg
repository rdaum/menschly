MEMORY {
  ZP: start = $000080, size = $000080, type = rw;
  CODE: start = $00c000, size = $003e00, file = %O;
  META: start = $00fe00, size = $000100, file = %O;
  BSS: start = $009000, size = $000f00, type = rw;
  VECTORS: start = $00ffee, size = $000002, file = %O;
}
FILES {
  %O: format = atari;
}
FORMATS {
  atari: runad = main;
}
SEGMENTS {
  ZEROPAGE: load = ZP, type = zp;
  CODE: load = CODE, type = ro;
  MENSCH_META: load = META, type = ro;
  BSS: load = BSS, type = bss;
  VECTORS: load = VECTORS, type = ro;
}
